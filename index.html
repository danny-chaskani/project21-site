<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project21</title>
  <link rel="icon" type="image/svg+xml" href="assets/p21-favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/p21-favicon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/Jost-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/p21-palette.css">
  <link rel="stylesheet" href="assets/css/p21.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--p21-mist);
      color: var(--p21-charcoal);
      font-family: "IBM Plex Sans Hebrew", system-ui, sans-serif;
      font-weight: 400;
      line-height: 1.6;
    }

    a { color: inherit; }
    a:hover { color: var(--p21-walnut); }

    header, footer, main { padding-inline: clamp(24px, 6vw, 96px); }

    header { padding-block: clamp(24px, 4vw, 48px); }

    .logo { display: block; height: 36px; width: auto; }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-block: 48px;
    }

    h1 {
      margin: 0;
      font-family: "Jost", system-ui, sans-serif;
      font-weight: 300;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      line-height: 1.15;
      color: var(--p21-charcoal);
    }

    .sub {
      margin: clamp(16px, 2.5vw, 28px) 0 0;
      font-weight: 300;
      font-size: clamp(1.25rem, 2.6vw, 1.75rem);
      line-height: 1.5;
      color: var(--p21-charcoal);
    }

    .home-cta { margin-top: clamp(24px, 4vw, 40px); }

    footer { padding-bottom: clamp(24px, 4vw, 40px); }

    .rule {
      border-top: 1px solid var(--p21-steel);
      padding-top: 20px;
      font-size: 0.9375rem;
      color: var(--p21-graphite);
    }

    @media (max-width: 600px) {
      .logo { height: 28px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">דילוג לתוכן</a>
  <header>
    <img class="logo" src="assets/p21-horizontal-charcoal.svg" alt="Project21">
  </header>

  <main id="main" tabindex="-1">
    <h1 lang="en" dir="ltr">Objects with an address.</h1>
    <p class="sub">אביזרי מתכת לבית ולשולחן העבודה.</p>
    <a class="btn btn-secondary home-cta" href="/frames/">לכל המסגרות</a>
  </main>

  <footer>
    <div class="rule">project21.net</div>
  </footer>
</body>
</html>
